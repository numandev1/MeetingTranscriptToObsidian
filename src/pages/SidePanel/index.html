<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live transcript</title>
    <link rel="stylesheet" href="styles/app.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: var(--space-4) var(--space-4) var(--space-3);
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        /* The title is editable, so it needs to look editable on hover */
        #meeting-title {
            font-size: var(--text-md);
            font-weight: 600;
            border-radius: var(--radius-sm);
            padding: 0.15rem 0.3rem;
            margin: -0.15rem -0.3rem;
            transition: background-color var(--dur-fast) var(--ease);
            cursor: text;
        }

        #meeting-title:hover { background: var(--surface-hover); }

        #meeting-title:focus {
            outline: none;
            background: var(--bg);
            box-shadow: 0 0 0 2px var(--accent-line);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-2);
            font-size: var(--text-xs);
            color: var(--ink-subtle);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        @media (prefers-reduced-motion: no-preference) {
            .live-dot { animation: pulse 2s var(--ease) infinite; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* --- Actions on the meeting in progress ------------------------------ */
        .panel-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-3);
        }

        .panel-actions[hidden] { display: none; }

        .action-status {
            margin-top: var(--space-2);
            font-size: var(--text-sm);
            color: var(--ink-subtle);
            line-height: 1.5;
        }

        .action-status:empty { display: none; }
        .action-status.is-error { color: var(--danger); }

        /* --- Summary so far ---------------------------------------------------
           Capped so the live transcript underneath always keeps most of the panel. */
        #live-summary {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            max-height: 55vh;
            overflow-y: auto;
        }

        #live-summary[hidden] { display: none; }

        #live-summary > summary {
            position: sticky;
            top: 0;
            display: flex;
            align-items: baseline;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-4);
            background: var(--surface);
            cursor: pointer;
            font-weight: 600;
            color: var(--ink);
            list-style: none;
        }

        #live-summary > summary::-webkit-details-marker { display: none; }

        #live-summary > summary::before {
            content: "";
            width: 0.4rem;
            height: 0.4rem;
            border-right: 1.5px solid var(--ink-subtle);
            border-bottom: 1.5px solid var(--ink-subtle);
            transform: translateY(-0.15rem) rotate(-45deg);
            transition: transform var(--dur-fast) var(--ease);
            align-self: center;
        }

        #live-summary[open] > summary::before { transform: translateY(-0.1rem) rotate(45deg); }

        #live-summary-meta {
            font-weight: 400;
            font-size: var(--text-sm);
            color: var(--ink-subtle);
        }

        .live-summary-body { padding: 0 var(--space-4) var(--space-3); }

        .live-summary-actions {
            display: flex;
            gap: var(--space-2);
            padding: 0 var(--space-4) var(--space-4);
        }

        #transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4);
            scroll-behavior: smooth;
        }

        .transcript-block { margin-bottom: var(--space-4); }

        .block-header {
            display: flex;
            align-items: baseline;
            gap: var(--space-2);
            margin-bottom: 0.15rem;
        }

        .speaker-name {
            font-weight: 600;
            font-size: var(--text-sm);
            color: var(--accent);
        }

        .block-time {
            font-size: var(--text-xs);
            color: var(--ink-subtle);
            font-variant-numeric: tabular-nums;
        }

        .block-text {
            color: var(--ink-muted);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* The in-progress utterance, distinguished from settled text */
        #live-transcript-placeholder .block-text { color: var(--ink); }

        #transcript-container:empty::after {
            content: "Waiting for someone to speak. Captions must be on in the meeting.";
            display: block;
            padding: var(--space-6) var(--space-4);
            text-align: center;
            color: var(--ink-subtle);
            font-size: var(--text-sm);
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <header class="panel-header">
        <h1 id="meeting-title">Live transcript</h1>
        <div class="live-indicator">
            <span class="live-dot"></span>
            <span>Recording on this device</span>
        </div>
        <!-- Only while a meeting is live: nothing here ends or files the meeting -->
        <div class="panel-actions" id="panel-actions" hidden>
            <button id="summarize-live" class="btn btn-primary btn-sm">Summarise so far</button>
            <select class="download-format" id="live-download-format" aria-label="Transcript download format">
                <option value="txt">Text (.txt)</option>
                <option value="html">HTML (.html)</option>
            </select>
            <button id="download-live" class="btn btn-secondary btn-sm">Download transcript</button>
        </div>
        <p class="action-status" id="action-status" role="status" aria-live="polite"></p>
    </header>

    <details id="live-summary" open hidden>
        <summary>Summary <span id="live-summary-meta"></span></summary>
        <div class="live-summary-body" id="live-summary-body"></div>
        <div class="live-summary-actions">
            <select class="download-format" id="live-summary-download-format" aria-label="Summary download format">
                <option value="txt">Text (.txt)</option>
                <option value="html">HTML (.html)</option>
            </select>
            <button id="download-live-summary" class="btn btn-secondary btn-sm">Download summary</button>
            <button id="copy-live-summary" class="btn btn-secondary btn-sm">Copy</button>
        </div>
    </details>

    <div id="transcript-container"></div>
</body>

</html>
